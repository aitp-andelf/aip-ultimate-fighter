<!DOCTYPE html>
<html lang="en" class="h-full w-full bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIP Ultimate Fighter — Aros IT-Partner</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap');
      :root {
        --fg-bg: #07070a;
        --fg-panel: #121218;
        --fg-edge: #2a2a35;
        --fg-muted: #6b6b7b;
        --fg-text: #e8e8ef;
        --fg-accent: #e11d48;
        --fg-accent-dim: #9f1239;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        background-color: var(--fg-bg);
        color: var(--fg-text);
      }
      .font-arcade, .font-fighter {
        font-family: 'Bebas Neue', Impact, sans-serif;
        letter-spacing: 0.06em;
      }
      .menu-scanlines {
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.18) 2px,
          rgba(0,0,0,0.18) 4px
        );
        pointer-events: none;
      }
      .menu-vignette {
        background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.75) 100%);
        pointer-events: none;
      }
      .text-fighter-title {
        color: #f5f5f7;
        text-shadow:
          0 1px 0 #fff,
          0 3px 0 #b91c1c,
          0 6px 18px rgba(225, 29, 72, 0.45);
      }
    </style>
  </head>
  <body class="h-full w-full overflow-hidden text-slate-100">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
